<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רישום מחנה אימונים – Team Mizrachi MMA</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b0b;--card:#141414;--field:#1c1c1c;--red:#c41230;--red-hover:#a51029;--red-glow:rgba(196,18,48,0.22);--border:#272727;--text:#f0f0f0;--muted:#888}
html,body{min-height:100%;background:var(--bg);background-image:radial-gradient(ellipse 100% 40% at 50% 0%,rgba(196,18,48,0.09) 0%,transparent 70%);font-family:'Heebo',sans-serif;color:var(--text);direction:rtl}
body{display:flex;justify-content:center;padding:32px 16px 64px}
.card{width:100%;max-width:480px;background:var(--card);border-radius:16px;border:1px solid var(--border);border-top:3px solid var(--red);box-shadow:0 0 60px rgba(196,18,48,0.09),0 24px 64px rgba(0,0,0,0.55);overflow:hidden}
.header{padding:36px 28px 24px;text-align:center;border-bottom:1px solid var(--border)}
.logo{width:112px;height:112px;border-radius:50%;overflow:hidden;margin:0 auto 20px;border:2px solid rgba(196,18,48,0.4);box-shadow:0 0 32px rgba(196,18,48,0.38)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:4px 13px;border-radius:20px;margin-bottom:11px}
.header h1{font-size:22px;font-weight:900;line-height:1.3;margin-bottom:3px}
.header p{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:13px 20px;background:#181818;border-bottom:1px solid var(--border)}
.chip{font-size:11.5px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 11px}
.form-body{padding:26px 28px 32px}
.field{margin-bottom:17px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:7px}
.field label .req{color:var(--red);margin-right:2px}
.field input{width:100%;background:var(--field);border:1.5px solid var(--border);border-radius:9px;padding:13px 14px;font-size:15px;font-family:'Heebo',sans-serif;color:var(--text);direction:rtl;outline:none;transition:border-color 0.18s,box-shadow 0.18s;-webkit-appearance:none}
.field input::placeholder{color:#3a3a3a}
.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-glow)}
.field input.invalid{border-color:#dd0044;box-shadow:0 0 0 3px rgba(221,0,68,0.15)}
.field input:disabled{opacity:0.5}
.cb-box{background:var(--field);border:1.5px solid var(--border);border-radius:11px;padding:15px;margin-bottom:22px;transition:border-color 0.18s,background 0.18s}
.cb-box.on{border-color:var(--red);background:rgba(196,18,48,0.05)}
.cb-box.invalid-cb{border-color:#dd0044}
.cb-row{display:flex;align-items:flex-start;gap:12px}
.cb-row input[type=checkbox]{width:19px;height:19px;min-width:19px;margin-top:3px;accent-color:var(--red);cursor:pointer}
.cb-text{font-size:13px;color:var(--muted);line-height:1.7;cursor:pointer}
.cb-text strong{color:var(--text);font-weight:700}
.btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:800;font-family:'Heebo',sans-serif;cursor:pointer;transition:background 0.18s,transform 0.13s,box-shadow 0.18s;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:var(--red-hover);box-shadow:0 6px 24px rgba(196,18,48,0.38);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:0.65;cursor:not-allowed;transform:none}
.spinner{width:17px;height:17px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:none}
.btn.loading .spinner{display:inline-block}
.btn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err-msg{display:none;background:rgba(221,0,68,0.08);border:1px solid rgba(221,0,68,0.3);color:#ff5577;font-size:13px;border-radius:9px;padding:11px 14px;margin-bottom:16px;text-align:center}
.err-msg.show{display:block}
.success{display:none;text-align:center;padding:56px 28px 60px}
.success.on{display:block}
.s-icon{width:72px;height:72px;border-radius:50%;border:2px solid var(--red);background:rgba(196,18,48,0.1);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 22px;animation:pop 0.4s ease}
@keyframes pop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.success h2{font-size:22px;font-weight:900;margin-bottom:10px}
.success p{font-size:14px;color:var(--muted);line-height:1.7}
.footer{text-align:center;padding:13px;font-size:11px;color:#2e2e2e;border-top:1px solid var(--border);letter-spacing:1px}
@media(max-width:480px){
  body{padding:0 0 48px}
  .card{border-radius:0;border-left:none;border-right:none}
  .header{padding:28px 20px 22px}
  .form-body{padding:22px 20px 28px}
  .header h1{font-size:20px}
  .logo{width:96px;height:96px}
}
</style>
</head>

      <div class="field">
        <label for="parentEl">שם מלא של ההורה <span class="req">*</span></label>
        <input id="parentEl" type="text" placeholder="שם פרטי ושם משפחה" autocomplete="name">
      </div>
      <div class="field">
        <label for="idnum">תעודת זהות <span class="req">*</span></label>
        <input id="idnum" type="text" inputmode="numeric" placeholder="מספר ת.ז. של הילד/ה" autocomplete="off" maxlength="9">
      </div>
      <div class="field">
        <label for="phone">טלפון נייד <span class="req">*</span></label>
        <input id="phone" type="tel" inputmode="tel" placeholder="05X-XXXXXXX" autocomplete="tel">
      </div>
      <div class="cb-box" id="cb-box">
        <div class="cb-row">
          <input type="checkbox" id="confirm">
          <label class="cb-text" for="confirm">
            הנני מאשר/ת כי הרישום הוא בתשלום של <strong>649 ₪</strong> עבור אימונים בימים <strong>א׳–ה׳</strong>, יולי 2026, בין השעות <strong>14:00–16:00</strong>.<br>
            מקום: <strong>הבית הירוק, רחוב האתרוג 2, גבעת שמואל</strong>.
          </label>
        </div>
      </div>
      <button type="submit" class="btn" id="submit-btn">
        <span class="spinner"></span>
        <span class="btn-text">שלח רישום ←</span>
      </button>
    </form>
  </div>
  <div class="success" id="success-section">
    <div class="s-icon">✓</div>
    <h2>הרישום התקבל! 🥊</h2>
    <p>תודה על הרישום!<br>נשמח לראותכם במחנה האימונים.<br>ניצור קשר בקרוב.</p>
  </div>
  <div class="footer">DISCIPLINE · STRENGTH · HONOR</div>
</div>
<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycby83sYNFGeFIVPu6kfYSidQiFHzzO75lyqJvPtXPh9nfw8B6OMyWKAbkkLjZ4LPTAIv/exec';

  var cbBox   = document.getElementById('cb-box');
  var cbInput = document.getElementById('confirm');
  var submitBtn = document.getElementById('submit-btn');
  var errMsg = document.getElementById('err-msg');

  cbInput.addEventListener('change', function () {
    cbBox.classList.toggle('on', cbInput.checked);
    if (cbInput.checked) cbBox.classList.remove('invalid-cb');
  });

  ['child','parentEl','idnum','phone'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      this.classList.remove('invalid');
    });
  });

  document.getElementById('reg-form').addEventListener('submit', function (e) {
    e.preventDefault();
    errMsg.classList.remove('show');

    var childEl  = document.getElementById('child');
    var parentEl = document.getElementById('parentEl');
    var idnumEl  = document.getElementById('idnum');
    var phoneEl  = document.getElementById('phone');
    var valid = true;

    [childEl, parentEl, idnumEl, phoneEl].forEach(function (el) {
      if (!el.value.trim()) { el.classList.add('invalid'); valid = false; }
      else { el.classList.remove('invalid'); }
    });

    if (!cbInput.checked) { cbBox.classList.add('invalid-cb'); valid = false; }
    if (!valid) return;

    var payload = {
      child_name: childEl.value.trim(),
      parent_name: parentEl.value.trim(),
      id_number: idnumEl.value.trim(),
      phone: phoneEl.value.trim()
    };

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    [childEl, parentEl, idnumEl, phoneEl, cbInput].forEach(function(el){ el.disabled = true; });

    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(function () {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-section').classList.add('on');
    })
    .catch(function () {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
      [childEl, parentEl, idnumEl, phoneEl, cbInput].forEach(function(el){ el.disabled = false; });
      errMsg.classList.add('show');
    });
  });
</script>
</body>
</html>
